<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserTrust</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>BrowserTrust</h1>
      <label class="switch" title="Turn monitoring on or off">
        <input type="checkbox" id="monitoring-toggle" />
        <span class="slider"></span>
      </label>
    </header>
    <p id="monitoring-status" class="status" aria-live="polite">Loading…</p>

    <section>
      <h2>This site</h2>
      <p id="site-status" class="muted"></p>
      <div class="actions">
        <button id="allow-site" hidden></button>
        <button id="remove-site" class="secondary" hidden>Remove access</button>
        <button id="allow-all" class="secondary" hidden>Allow all websites…</button>
      </div>
    </section>

    <section>
      <h2>Collectors</h2>
      <ul id="collectors-list"></ul>
      <p id="collectors-hint" class="muted"></p>
      <div class="actions">
        <button id="enable-permissions" hidden>Grant required permission</button>
      </div>
    </section>

    <section>
      <h2>Events</h2>
      <p id="events-summary" class="muted"></p>
      <ul id="events-list"></ul>
      <button id="clear-events" class="secondary" hidden>Clear stored events</button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
